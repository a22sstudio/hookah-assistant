# ─── Railway Nixpacks конфиг ───
# Nixpacks — это нативный Railway buildpack, быстрее Dockerfile.

[phases.setup]
# Устанавливаем OpenSSL для Prisma + Node.js
aptPkgs = ["openssl", "ca-certificates"]
nixPkgs = ["nodejs_22", "bun"]

[phases.install]
# Устанавливаем зависимости
cmds = [
  "bun install"
]

[phases.build]
# Переключаемся на PostgreSQL-схему, генерируем Prisma, билдим Next.js
cmds = [
  "cp prisma/schema.postgres.prisma prisma/schema.prisma",
  "bunx prisma generate",
  "bun run build"
]

[phases.start]
# Применяем схему к БД (с таймаутом) и стартуем через node (не bun)
# Node.js стабильнее для Next.js production server
cmds = [
  "sh -c 'if [ -z \"$DATABASE_URL\" ]; then echo \"⚠️ DATABASE_URL не задан\"; else timeout 30 npx prisma db push --accept-data-loss || echo \"⚠️ db:push не удался — стартую всё равно\"; fi'",
  "npx next start"
]

[variables]
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"
