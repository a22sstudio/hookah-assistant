# ─── Railway конфиг ───
# Используем Nixpacks (нативный, быстрее Dockerfile) — конфиг в nixpacks.toml
# Nixpacks автоматически определит Next.js + Bun, быстрее собирается

[deploy]
# Railway выдаст публичный URL автоматически
healthcheckPath = "/api/auth/me"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ─── Переменные окружения (задаются в Railway dashboard) ───
# DATABASE_URL=postgresql://... (Railway PostgreSQL plugin выдаст автоматически)
# HF_TOKEN=hf_... (Hugging Face токен для AI)
# TELEGRAM_BOT_TOKEN=...
# BOT_SECRET=любая-случайная-строка
# NEXT_API_URL=https://твой-апп.up.railway.app
# WEBHOOK_URL=https://твой-апп.up.railway.app
# USE_POLLING=0
